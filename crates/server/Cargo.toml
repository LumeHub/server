[package]
name = "lumehub-server"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lumehub-server"
path = "src/main.rs"

[features]
default = ["google"]
google  = ["dep:api-google"]

[dependencies]
domain      = { workspace = true }
engine      = { workspace = true }
application = { workspace = true }
effects     = { workspace = true }
drivers     = { workspace = true }
api         = { workspace = true }
api-google  = { workspace = true, optional = true }
api-legacy  = { workspace = true }
httpd       = { workspace = true }
chrono      = { workspace = true }
clap        = { workspace = true }
toml        = { workspace = true }
serde       = { workspace = true }
discovery   = { workspace = true }
persistence = { workspace = true }
store       = { workspace = true }
mqtt        = { workspace = true }
smol        = { workspace = true }
serde_json  = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
